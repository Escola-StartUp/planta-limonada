<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {Reflector} from 'three/addons/objects/Reflector.js';

/* ================= PARÂMETROS =================
   Ginásio 35 x 41 m. Quadra 15 x 28 m deslocada para a esquerda (x=-4),
   liberando a LATERAL DIREITA (x≈17) para o café + arena + estandes,
   todos orientados como os estandes (voltados para a quadra, em -x).        */
const P={purple:0x5b1f9e,cloth:0x43167e,black:0x111114,top:0xf2f0ec,
  X0:-18,X1:17,        // laterais do ginásio
  Z0:-20,Z1:21,        // fundo (café) e frente
  CH:11,               // pé-direito
  CAFE:{x:10,z:-13},   // grupo do café: com rotation.y=-90°, a cortina (z local -7) cai em x=17
  ARENA:{x0:9.6,x1:16.9,z0:-6.6,z1:1.4},   // arena: encosta no café e no início dos estandes
  STANDS:{lat:4,latX:13.6,latZ0:2.6,latDx:3.1,end:5,endX0:-8.4,endDx:3.6,endZ:17.6},
  SL:{x0:-13,x1:12},                          // laterais da quadra (x0 = borda da arquibancada)
  DOOR_A:{x:-4.6},DOOR_B:{z:16.5},DOOR_W:2.2,DOOR_H:2.7,
  logoCal:'calabria.png',logoSt:'Logos_Startup02.png'};
const G={x0:P.X0,x1:P.X1,z0:P.Z0,z1:P.Z1};
/* A demarcação ocupa toda a área da quadra (parede a parede) e o centro da
   quadra coincide com o centro do ginásio. */
const CX=(G.x0+G.x1)/2, CZ=(G.z0+G.z1)/2, HL=(G.z1-G.z0)/2, HWS=(P.SL.x1-P.SL.x0)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const _qs=new URLSearchParams(location.search);
const STILL=parseInt(_qs.get('still'))||0;let frames=0;   // ?still=N limita os quadros (captura de tela)

/* ================= CENA / RENDERER ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:!!STILL});
let pr=Math.min(devicePixelRatio,1.75);renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0e);scene.fog=new THREE.Fog(0x0a0a0e,60,135);
const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,240);
{const e=new THREE.Scene();
 e.add(new THREE.Mesh(new THREE.BoxGeometry(52,16,66),new THREE.MeshBasicMaterial({color:0x32363f,side:THREE.BackSide})));
 for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const m=new THREE.Mesh(new THREE.PlaneGeometry(4.5,1.8),new THREE.MeshBasicMaterial({color:new THREE.Color(0xdfe9ff).multiplyScalar(15)}));m.position.set(i*11,8.4,j*12);m.rotation.x=Math.PI/2;e.add(m);}
 const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(e,.04).texture;}

/* ================= TEXTURAS PROCEDURAIS ================= */
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
function tex(c,rep,srgb){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
const woodC=cv(1024,1024,(g,w,h)=>{
  g.fillStyle='#b5854f';g.fillRect(0,0,w,h);
  const rows=16,ph=h/rows;
  for(let r=0;r<rows;r++){const y=r*ph,base=rnd(-16,16);
    g.fillStyle=`rgb(${(166+base)|0},${(122+base*.8)|0},${(76+base*.6)|0})`;g.fillRect(0,y,w,ph);
    for(let i=0;i<70;i++){const v=rnd(-26,26);
      g.strokeStyle=`rgba(${(120+v)|0},${(84+v)|0},${(44+v)|0},.32)`;g.lineWidth=rnd(.5,1.9);
      g.beginPath();const yy=y+rnd(0,ph);g.moveTo(0,yy);
      for(let x=0;x<=w;x+=24)g.lineTo(x,yy+Math.sin(x*.018+i)*1.4);g.stroke()}
    g.fillStyle='rgba(70,44,20,.45)';g.fillRect(0,y,w,1.6);
    g.fillRect(rnd(0,w),y,1.6,ph)}});
const weave=cv(128,128,(g,w,h)=>{for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){g.fillStyle=((x+y)/4)%2?'#999':'#666';g.fillRect(x,y,4,4)}});
const folds=cv(512,64,(g,w,h)=>{for(let x=0;x<w;x++){const v=128+100*Math.sin(x/w*Math.PI*2*28)*Math.cos(x*.07);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,0,1,h)}});
const brushed=cv(256,256,(g,w,h)=>{g.fillStyle='#999';g.fillRect(0,0,w,h);for(let i=0;i<1500;i++){const v=rnd(110,190)|0;g.strokeStyle=`rgb(${v},${v},${v})`;g.beginPath();const y=rnd(0,h);g.moveTo(0,y);g.lineTo(w,y+rnd(-1,1));g.stroke()}});
const netGrid=cv(64,64,(g)=>{g.clearRect(0,0,64,64);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=2.5;g.strokeRect(0,0,64,64);for(let i=16;i<64;i+=16){g.beginPath();g.moveTo(i,0);g.lineTo(i,64);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(64,i);g.stroke()}});
const floorTex=tex(woodC,[8.75,10.25],true),clothB=tex(weave,[8,8]),curtB=tex(folds,[6,1]),inoxB=tex(brushed,[2,2]);
const netBase=new THREE.CanvasTexture(netGrid);netBase.wrapS=netBase.wrapT=THREE.RepeatWrapping;

/* ================= MATERIAIS ================= */
const M={
 floor:new THREE.MeshPhysicalMaterial({map:floorTex,color:0xffffff,roughness:.28,metalness:0,clearcoat:.85,clearcoatRoughness:.14,envMapIntensity:.75,transparent:true,opacity:.84}),
 wall:new THREE.MeshStandardMaterial({color:0x2e333c,roughness:.92}),
 step:new THREE.MeshStandardMaterial({color:0x3a4049,roughness:.85}),
 curtain:new THREE.MeshStandardMaterial({color:0x0b0b0d,roughness:.96,bumpMap:curtB,bumpScale:2.5,side:THREE.DoubleSide}),
 black:new THREE.MeshStandardMaterial({color:P.black,roughness:.72,metalness:.08}),
 lam:new THREE.MeshPhysicalMaterial({color:P.top,roughness:.28,clearcoat:.8,clearcoatRoughness:.2}),
 plastic:new THREE.MeshPhysicalMaterial({color:0xf6f6f4,roughness:.38,clearcoat:.6,clearcoatRoughness:.3}),
 cloth:new THREE.MeshStandardMaterial({color:P.cloth,roughness:.88,bumpMap:clothB,bumpScale:.5,side:THREE.DoubleSide}),
 inox:new THREE.MeshStandardMaterial({color:0xa4aab2,metalness:1,roughness:.4,bumpMap:inoxB,bumpScale:.25,envMapIntensity:.65}),
 steel:new THREE.MeshStandardMaterial({color:0xb9bfc6,metalness:1,roughness:.38}),
 iron:new THREE.MeshStandardMaterial({color:0x1c1c1e,metalness:.75,roughness:.5}),
 appliance:new THREE.MeshStandardMaterial({color:0x101012,metalness:.2,roughness:.42}),
 leaf:new THREE.MeshStandardMaterial({color:0x2f8a3a,roughness:.5,side:THREE.DoubleSide}),
 pot:new THREE.MeshStandardMaterial({color:0x181818,roughness:.55}),
 white:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45}),
 rubber:new THREE.MeshStandardMaterial({color:0x151517,roughness:.95}),
 blue:new THREE.MeshStandardMaterial({color:0x1d3f6e,roughness:.7}),
 purple:new THREE.MeshStandardMaterial({color:P.purple,roughness:.8,emissive:P.purple,emissiveIntensity:.22}),
 panel:new THREE.MeshStandardMaterial({color:0x17171b,roughness:.85}),
 wood:new THREE.MeshStandardMaterial({color:0xb98a55,roughness:.7}),
 seatA:new THREE.MeshStandardMaterial({color:0x2f5fb0,roughness:.55}),
 seatB:new THREE.MeshStandardMaterial({color:0x24262e,roughness:.6}),
 glass:new THREE.MeshPhysicalMaterial({color:0xbcd8f2,roughness:.15,metalness:0,transparent:true,opacity:.5,envMapIntensity:1.4,clearcoat:.6}),
 line:y=>new THREE.MeshStandardMaterial({color:y,roughness:.35,transparent:true,opacity:.92}),
 net:()=>new THREE.MeshStandardMaterial({map:netBase.clone(),transparent:true,alphaTest:.04,side:THREE.DoubleSide,color:0xffffff,roughness:.9})};

/* ================= HELPERS ================= */
const colliders=[];
function mesh(geo,mat,x,y,z,par){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;par.add(m);return m}
function box(w,h,d,mat,x,y,z,par=scene){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,par)}
function cyl(r,h,mat,x,y,z,par=scene,seg=20){return mesh(new THREE.CylinderGeometry(r,r,h,seg),mat,x,y,z,par)}
function addCol(x0,x1,z0,z1){colliders.push({x0,x1,z0,z1})}
const blobTex=new THREE.CanvasTexture(cv(64,64,(g)=>{const r=g.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,'rgba(0,0,0,.5)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64)}));
function shadowBlob(par,x,z,s){const m=new THREE.Mesh(new THREE.PlaneGeometry(s,s),new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.014,z);par.add(m)}
function plant(par,x,y,z,s=1){
  const g=new THREE.Group();
  cyl(.055*s,.085*s,M.pot,0,.042*s,0,g);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2+rnd(0,.4);
   const l=new THREE.Mesh(new THREE.SphereGeometry(.055*s,7,5),M.leaf);
   l.scale.set(1,.28,1.7);l.position.set(Math.sin(a)*.045*s,.1*s,Math.cos(a)*.045*s);
   l.rotation.set(-.35-rnd(0,.4),a,0);l.translateY(.05*s);l.castShadow=true;g.add(l)}
  g.position.set(x,y,z);par.add(g);return g}
function chair(){
  const g=new THREE.Group();
  box(.44,.05,.42,M.plastic,0,.45,0,g);
  [[-.19,-.18],[.19,-.18],[-.19,.18],[.19,.18]].forEach(([x,z])=>{const l=cyl(.018,.46,M.plastic,x,.23,z,g,8);l.rotation.set(z*.14,0,-x*.14)});
  [-.19,.19].forEach(x=>{const p=cyl(.017,.56,M.plastic,x,.71,-.2,g,8);p.rotation.x=-.13});
  const rail=cyl(.019,.4,M.plastic,0,.96,-.235,g,8);rail.rotation.z=Math.PI/2;
  for(let i=0;i<6;i++)box(.028,.44,.018,M.plastic,-.155+i*.062,.72,-.212,g);
  return g}
function tableCloth(w,d,topY,hang,mat){
  const g=new THREE.Group();
  const top=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);top.rotation.x=-Math.PI/2;top.position.y=topY;top.receiveShadow=true;g.add(top);
  const skirt=(len,px,pz,ry)=>{
    const geo=new THREE.PlaneGeometry(len,hang,30,6),p=geo.attributes.position;
    for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);const v=(y+hang/2)/hang;
      p.setZ(i,Math.sin(x*Math.PI*3.4)*.016+(1-v)*.05);p.setX(i,x+Math.sin(x*Math.PI*3.4)*.012)}
    geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.position.set(px,topY-hang/2,pz);m.rotation.y=ry;g.add(m)};
  skirt(w,0,-d/2,0);skirt(w,0,d/2,Math.PI);skirt(d,-w/2,0,-Math.PI/2);skirt(d,w/2,0,Math.PI/2);
  return g}
const SEATG=new THREE.BoxGeometry(.5,.4,.5);
function addSeats(par,list,mat){
  const im=new THREE.InstancedMesh(SEATG,mat,list.length),m=new THREE.Matrix4();
  list.forEach((p,i)=>{m.makeTranslation(p[0],p[1],p[2]);im.setMatrixAt(i,m)});
  im.instanceMatrix.needsUpdate=true;im.castShadow=im.receiveShadow=true;par.add(im);return im}
function tiersX(xFront,z0,z1,rows,mat){
  const g=new THREE.Group(),list=[],rs=.92,ri=.46;
  for(let r=0;r<rows;r++){const xf=xFront-r*rs,y=ri*(r+1);
    box(rs+.02,ri,z1-z0,M.step,xf-rs/2,y-ri/2,(z0+z1)/2,g);
    const n=Math.max(1,Math.round((z1-z0)/.62));
    for(let i=0;i<n;i++)list.push([xf-.16,y+.2,z0+(i+.5)*(z1-z0)/n])}
  addSeats(g,list,mat);return g}

/* ================= LOGOS ================= */
const LOGO={ [P.logoCal]:{asp:3.115,crop:[0.049,0.127,0.951,0.874]},
             [P.logoSt]  :{asp:2.528,crop:[0.003,0.016,0.995,0.993]} };
let loaded=0,total=4;const barI=document.querySelector('#bar i');
const prog=()=>{barI.style.width=(++loaded/(total+1)*100)+'%'};
function logoMesh(url,w,par,zOff=.02,ry=0){
  const info=LOGO[url],g=new THREE.Group();
  const mat=new THREE.MeshBasicMaterial({transparent:true,alphaTest:.02,toneMapped:false,side:THREE.DoubleSide});
  const geo=new THREE.PlaneGeometry(w,w/info.asp),uv=geo.attributes.uv,[u0,v0,u1,v1]=info.crop;
  for(let i=0;i<uv.count;i++)uv.setXY(i,u0+uv.getX(i)*(u1-u0),v0+uv.getY(i)*(v1-v0));
  const m=new THREE.Mesh(geo,mat);m.position.z=zOff;g.add(m);g.rotation.y=ry;
  new THREE.TextureLoader().load(url,t=>{
    t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;mat.map=t;mat.needsUpdate=true;prog();
  },undefined,()=>{
    mat.map=new THREE.CanvasTexture(cv(512,160,(c)=>{c.fillStyle='#fff';c.font='700 62px Montserrat,sans-serif';c.textAlign='center';c.fillText(url===P.logoCal?'Rede Calábria':'Escola Startup',256,95)}));
    mat.needsUpdate=true;prog()});
  par.add(g);return g}

/* ================= MARCAÇÕES (procedurais) ================= */
const drawCup=(g,cx,cy,s,fill)=>{g.save();g.translate(cx,cy);g.scale(s,s);
  g.strokeStyle='#fff';g.lineWidth=9;g.lineJoin='round';g.lineCap='round';
  g.beginPath();g.moveTo(-58,64);g.lineTo(58,64);g.stroke();
  g.beginPath();g.moveTo(-46,-14);g.lineTo(-46,52);g.lineTo(46,52);g.lineTo(46,-14);g.stroke();
  g.beginPath();g.ellipse(0,-14,46,13,0,0,7);g.stroke();
  g.beginPath();g.arc(56,16,21,-1.25,1.25);g.stroke();
  for(let i=-1;i<=1;i++){g.beginPath();const sx=i*30;g.moveTo(sx,-36);g.bezierCurveTo(sx-16,-58,sx+16,-76,sx-4,-102);g.stroke()}
  if(fill){g.fillStyle='#fff';g.beginPath();g.ellipse(0,-14,46,13,0,0,7);g.fill()}
  g.restore()};
function drawBanner(g,W,H){
  g.fillStyle='#5b1f9e';g.fillRect(0,0,W,H);
  const gx=170,gy=H/2;g.fillStyle='#fff';g.beginPath();
  g.moveTo(gx-92,gy+16);g.lineTo(gx-92,gy-22);g.quadraticCurveTo(gx-92,gy-58,gx-56,gy-58);
  g.lineTo(gx+56,gy-58);g.quadraticCurveTo(gx+92,gy-58,gx+92,gy-22);
  g.lineTo(gx+92,gy+16);g.quadraticCurveTo(gx+92,gy+58,gx+56,gy+58);
  g.quadraticCurveTo(gx+32,gy+58,gx+20,gy+28);g.lineTo(gx-20,gy+28);
  g.quadraticCurveTo(gx-32,gy+58,gx-56,gy+58);g.quadraticCurveTo(gx-92,gy+58,gx-92,gy+16);
  g.closePath();g.fill();
  g.strokeStyle='#fff';g.lineWidth=7;g.beginPath();g.moveTo(gx-14,gy-58);g.quadraticCurveTo(gx-4,gy-84,gx+10,gy-84);g.stroke();
  g.fillStyle='#5b1f9e';g.fillRect(gx-58,gy-14,46,11);g.fillRect(gx-42,gy-30,11,46);
  [[0,-20],[20,0],[0,20],[-20,0]].forEach(([ox,oy])=>{g.beginPath();g.arc(gx+46+ox,gy+oy,10,0,7);g.fill()});
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  g.font='800 104px Montserrat,Poppins,sans-serif';g.fillText('Café',W/2,H*.31);
  g.font='800 112px Montserrat,Poppins,sans-serif';g.fillText('Gamefood',W/2,H*.68);
  drawCup(g,W-170,H/2,.85,true);
}
function drawTv(g,W,H){
  g.fillStyle='#5b1f9e';g.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.36;
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=7;g.lineCap='round';
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2+Math.PI/14;g.beginPath();
    g.moveTo(cx+Math.cos(a)*200,cy+Math.sin(a)*200);g.lineTo(cx+Math.cos(a)*228,cy+Math.sin(a)*228);g.stroke()}
  drawCup(g,cx,cy,1.15,true);
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  g.font='800 96px Montserrat,Poppins,sans-serif';g.fillText('Café',cx,cy+190);
  g.font='800 88px Montserrat,Poppins,sans-serif';g.fillText('Gamefood',cx,cy+282);
}
const bannerC=cv(1400,360,drawBanner), tvC=cv(1100,700,drawTv);
const bannerMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bannerC),toneMapped:false});
const tvMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(tvC),toneMapped:false});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{
  drawBanner(bannerC.getContext('2d'),1400,360);drawTv(tvC.getContext('2d'),1100,700);
  bannerMat.map.needsUpdate=true;tvMat.map.needsUpdate=true});

/* ================= PISO ================= */
const fw=G.x1-G.x0, fd=G.z1-G.z0, fcx=(G.x0+G.x1)/2, fcz=(G.z0+G.z1)/2;
const mirror=new Reflector(new THREE.PlaneGeometry(fw,fd),{textureWidth:512,textureHeight:512,color:0x9aa0a8});
mirror.rotation.x=-Math.PI/2;mirror.position.set(fcx,-.004,fcz);scene.add(mirror);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(fw,fd),M.floor);
floor.rotation.x=-Math.PI/2;floor.position.set(fcx,0,fcz);floor.receiveShadow=true;scene.add(floor);

/* ================= LINHAS DA QUADRA (amarelo) ================= */
const CY=0xf5c518;
const CL=(w,d,x,z,y=.008)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M.line(CY));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);scene.add(m)};

function doorway(axis,wallC,center,side){side=side||-1;
  const W=P.DOOR_W,H=P.DOOR_H,t=W/2+.18,CHh=P.CH;
  /* parede em segmentos: esquerda, direita e verga (furo real) */
  const seg=(len,height,along,cy)=>{ if(len<.03||height<.03)return;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(len,height),M.wall);
    if(axis==='x'){m.position.set(wallC,cy,along);m.rotation.y=Math.PI/2}
    else{m.position.set(along,cy,wallC)}
    m.receiveShadow=true;scene.add(m)};
  seg(center-t-G.z0,CHh,G.z0+(center-t-G.z0)/2,CHh/2);
  seg(G.z1-(center+t),CHh,(center+t)+(G.z1-(center+t))/2,CHh/2);
  seg(W,CHh-H,center,H+(CHh-H)/2);
  /* moldura de aço */
  const jamb=off=>axis==='x'?box(.18,H,.14,M.steel,wallC,H/2,center+off)
                          :box(.14,H,.18,M.steel,center+off,H/2,wallC);
  jamb(-t+.07).castShadow=true;jamb(t-.07).castShadow=true;
  (axis==='x'?box(.18,.15,W+.36,M.steel,wallC,H+.075,center)
            :box(W+.36,.15,.18,M.steel,center,H+.075,wallC)).castShadow=true;
  /* folha da porta: dobradiça na ombreira (origem), aberta ~26° para dentro */
  {const g=new THREE.Group();
   box(W,H,.06,M.plastic,W/2,H/2,0,g);                    // folha vertical
   box(W-.26,H*.32,.075,M.glass,W/2,H*.63,0,g);           // visor
   box(W-.3,.09,.03,M.steel,W/2,H*.2,-.05,g);             // travessa
   box(.09,.34,.05,M.steel,W-.2,H*.46,-.08,g);            // maçaneta
   g.rotation.y=axis==='x'?(side<0?1.12:-1.12):(side<0?3.54:-.4);
   g.position.set(axis==='x'?wallC+.15:center+side*(t+.14),0,
                  axis==='x'?center+side*(t+.14):wallC+.15);
   scene.add(g)}
  /* exterior iluminado + feixe de sol + mancha no piso */
  {const m=new THREE.Mesh(new THREE.PlaneGeometry(W,H),sunMat);
   if(axis==='x'){m.position.set(wallC-.06,H/2,center);m.rotation.y=Math.PI/2}
   else{m.position.set(center,H/2,wallC-.06)}
   scene.add(m)}
  {const s=new THREE.SpotLight(0xfff0cc,300,38,.6,.65,1.05);
   if(axis==='x'){s.position.set(wallC-4,7,center);s.target.position.set(wallC+12,0,center-2)}
   else{s.position.set(center+3,7,wallC-4);s.target.position.set(center-1,0,wallC+13)}
   scene.add(s,s.target)}
  {const m=new THREE.Mesh(new THREE.PlaneGeometry(10,17),poolMat());
   m.rotation.x=-Math.PI/2;
   if(axis==='x'){m.rotation.z=Math.PI/2;m.position.set(wallC+6,.016,center-1)}
   else{m.position.set(center-1,.016,wallC+6.5)}
   scene.add(m)}
}
